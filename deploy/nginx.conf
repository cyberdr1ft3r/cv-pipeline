map $http_x_forwarded_for $trusted_forwarded_for {
    "" $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_real_ip $trusted_real_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $trusted_forwarded_proto {
    "" $scheme;
    ~*^https$ https;
    ~*^http$ http;
    default $scheme;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        proxy_pass http://api:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_real_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_real_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
