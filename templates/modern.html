<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CV - {nom_complet}</title>
    <style>
        * {{ margin: 0; padding: 0; box-sizing: border-box; }}
        @page {{ size: A4; margin: 0; }}
        body {{ font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 10.5pt; line-height: 1.2; }}
        .page {{ width: 21cm; min-height: 29.7cm; background: white; }}
        
        .header {{ 
            padding: 0.8cm 1cm; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }}
        .header-text {{ text-align: left; }}
        .header .name {{ font-size: 22pt; font-weight: 700; letter-spacing: 0.5px; }}
        .header .profile {{ font-size: 12pt; color: #f0f0f0; font-weight: 300; margin-top: 5px; }}
        
        .logo-container img {{
            max-height: 1.6cm;
            filter: brightness(0) invert(1); /* Makes logo white for the dark background */
        }}
        
        .content {{ display: flex; min-height: calc(29.7cm - 3cm); }}
        .left-column {{ width: 30%; padding: 0.8cm; background: #f8f9fa; border-right: 1px solid #e9ecef; }}
        .right-column {{ width: 70%; padding: 0.8cm; }}
        
        h1 {{ font-size: 12.5pt; font-weight: 600; margin: 0.5cm 0 0.35cm; color: #2c3e50; text-transform: uppercase; border-bottom: 3px solid #667eea; padding-bottom: 0.15cm; }}
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="header-text">
                <div class="name">{nom_complet}</div>
                <div class="profile">{titre}</div>
            </div>
            <div class="logo-container">
                <img src="{logo_url}" alt="Logo">
            </div>
        </div>
        <div class="content">
            <div class="left-column">{left_content}</div>
            <div class="right-column">
                {right_content_page1}
                {additional_pages}
            </div>
        </div>
    </div>
</body>
</html>
