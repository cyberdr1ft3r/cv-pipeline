<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CV - {nom_complet}</title>
    <style>
        * {{ margin: 0; padding: 0; box-sizing: border-box; }}
        @page {{ size: A4; margin: 0; }}
        body {{ font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10.5pt; line-height: 1.3; color: #333; }}
        .page {{ width: 21cm; min-height: 29.7cm; background: white; }}
        
        .header {{ 
            padding: 1.2cm 1cm 0.8cm; 
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: space-between;
            align-items: flex-end; /* Aligns items to the bottom border */
        }}
        .header-text {{ text-align: left; }}
        .header .name {{ font-size: 26pt; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }}
        .header .profile {{ font-size: 11pt; color: #666; margin-top: 5px; }}
        
        .logo-container img {{
            max-height: 1.4cm;
            filter: grayscale(1);
        }}
        
        .content {{ padding: 0.8cm 1cm; }}
        h1 {{ font-size: 11.5pt; font-weight: 400; margin: 0.6cm 0 0.3cm; color: #000; text-transform: uppercase; border-bottom: 1px solid #ddd; padding-bottom: 0.1cm; }}
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="header-text">
                <div class="name">{nom_complet}</div>
                <div class="profile">{titre}</div>
            </div>
            <div class="logo-container">
                <img src="{logo_url}" alt="Logo">
            </div>
        </div>
        <div class="content">
            {left_content}
            {right_content_page1}
            {additional_pages}
        </div>
    </div>
</body>
</html>
