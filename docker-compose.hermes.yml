services:
  hermes-cv:
    image: nousresearch/hermes-agent:latest
    container_name: cv_pipeline_hermes
    restart: unless-stopped
    command: gateway run
    profiles:
      - hermes-lab

    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY in deploy/hermes/.env}
      API_SERVER_MODEL_NAME: "cv-ingest-hermes"

    volumes:
      # Persistent Hermes config + OAuth tokens. Never commit this directory.
      - ./.hermes-cv:/opt/data

    # Lab endpoint is host-local only. Other containers on cvs_project_network
    # can reach Hermes at http://hermes-cv:8642/v1.
    ports:
      - "127.0.0.1:${HERMES_HOST_PORT:-8642}:8642"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    networks:
      - cvs_project_network
