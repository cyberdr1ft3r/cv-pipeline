  #     # Security
  #     N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-test_encryption_key_change_in_prod}

  #     # API access (required for MCP bridge)
  #     N8N_PUBLIC_API_DISABLED: "false"
