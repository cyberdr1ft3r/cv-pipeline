  #     DB_POSTGRESDB_HOST: postgres
  #     DB_POSTGRESDB_PORT: 5432
  #     DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-cv_pipeline}
  #     DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_user}
  #     DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_password_change_in_prod}

  #     # n8n core
  #     N8N_HOST: 0.0.0.0
