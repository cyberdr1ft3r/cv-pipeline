  # ─────────────────────────────────────────
  # n8n MCP bridge (AI tool integration)
  # ─────────────────────────────────────────
  # n8n_mcp:
  #   image: mcp/n8n:latest
  #   container_name: cv_pipeline_n8n_mcp
  #   restart: unless-stopped
  #   depends_on:
  #     - n8n
  #   environment:
  #     N8N_API_URL: http://n8n:5678
  #     N8N_API_KEY: ${N8N_API_KEY}
  #   healthcheck:
  #     disable: true
  #   networks:
  #     - cvs_project_network
  #   stdin_open: true
  #   tty: true

  # ─────────────────────────────────────────
  # Next.js frontend (Web UI)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend_enterprise
      dockerfile: Dockerfile
    container_name: cv_pipeline_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"
    volumes:
      - ./frontend_enterprise:/app
      - /app/node_modules
      # Do NOT mount /app/.next as a separate volume — it caches a stale
      # production build from the image and ignores live source edits.
    environment:
      # NEXT_PUBLIC_API_URL: http://api:8000/api/v1
      WATCHPACK_POLLING: "true"
    command: npm run dev
    networks:
      - cvs_project_network
